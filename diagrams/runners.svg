<svg xmlns="http://www.w3.org/2000/svg" width="800" height="528" viewBox="0 0 800 528" role="img" aria-labelledby="runners-title runners-desc" font-family="Helvetica, Arial, sans-serif">
  <title id="runners-title">Runners: why the East and West clocks get closer on Nov 1, 2026</title>
  <desc id="runners-desc">Two rows of runners. Before 2026, the East and West runners both stepped back one hour together, so the gap between them stayed the same. On Nov 1, 2026 only the East runner steps back, so the gap shrinks by one hour.</desc>
  <defs>
    <marker id="runners-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#4f5d75"/>
    </marker>
    <marker id="runners-arrow-accent" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#eb6c36"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="528" fill="#f5f5f5"/>

  <!-- Panel 1: every fall, before 2026 -->
  <text x="40" y="36" font-size="24" font-weight="700" fill="#2d3142">Every fall, before 2026</text>
  <text x="760" y="36" font-size="16" fill="#4f5d75" text-anchor="end">Dashed outline = where they stood</text>

  <g fill="none" stroke="#7a8399" stroke-width="2" stroke-dasharray="4,4">
    <circle cx="300" cy="76" r="16"/>
    <rect x="284" y="96" width="32" height="40" rx="12"/>
    <circle cx="660" cy="76" r="16"/>
    <rect x="644" y="96" width="32" height="40" rx="12"/>
  </g>

  <path d="M278 116 H164" fill="none" stroke="#4f5d75" stroke-width="3" marker-end="url(#runners-arrow)"/>
  <rect x="170" y="82" width="100" height="24" fill="#f5f5f5"/>
  <text x="220" y="100" font-size="16" fill="#4f5d75" text-anchor="middle">back 1 hour</text>

  <path d="M638 116 H524" fill="none" stroke="#4f5d75" stroke-width="3" marker-end="url(#runners-arrow)"/>
  <rect x="530" y="82" width="100" height="24" fill="#f5f5f5"/>
  <text x="580" y="100" font-size="16" fill="#4f5d75" text-anchor="middle">back 1 hour</text>

  <circle cx="140" cy="76" r="16" fill="#ffffff" stroke="#2d3142" stroke-width="2"/>
  <rect x="124" y="96" width="32" height="40" rx="12" fill="#ffffff" stroke="#2d3142" stroke-width="2"/>
  <circle cx="500" cy="76" r="16" fill="#2d3142"/>
  <rect x="484" y="96" width="32" height="40" rx="12" fill="#2d3142"/>
  <text x="140" y="164" font-size="20" font-weight="700" fill="#2d3142" text-anchor="middle">West</text>
  <text x="500" y="164" font-size="20" font-weight="700" fill="#2d3142" text-anchor="middle">East</text>

  <path d="M140 192 V208 M140 200 H500 M500 192 V208" fill="none" stroke="#4f5d75" stroke-width="2"/>
  <text x="320" y="236" font-size="20" font-weight="700" fill="#2d3142" text-anchor="middle">Gap stays the same</text>

  <line x1="40" y1="252" x2="760" y2="252" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Panel 2: Nov 1, 2026 -->
  <text x="40" y="300" font-size="24" font-weight="700" fill="#2d3142">Nov 1, 2026</text>

  <g fill="none" stroke="#7a8399" stroke-width="2" stroke-dasharray="4,4">
    <circle cx="660" cy="340" r="16"/>
    <rect x="644" y="360" width="32" height="40" rx="12"/>
  </g>

  <path d="M638 380 H524" fill="none" stroke="#eb6c36" stroke-width="3" marker-end="url(#runners-arrow-accent)"/>
  <rect x="530" y="346" width="100" height="24" fill="#f5f5f5"/>
  <text x="580" y="364" font-size="16" fill="#4f5d75" text-anchor="middle">back 1 hour</text>

  <text x="268" y="386" font-size="16" fill="#4f5d75" text-anchor="end">stays put</text>

  <circle cx="300" cy="340" r="16" fill="#ffffff" stroke="#2d3142" stroke-width="2"/>
  <rect x="284" y="360" width="32" height="40" rx="12" fill="#ffffff" stroke="#2d3142" stroke-width="2"/>
  <circle cx="500" cy="340" r="16" fill="#2d3142"/>
  <rect x="484" y="360" width="32" height="40" rx="12" fill="#2d3142"/>
  <text x="300" y="428" font-size="20" font-weight="700" fill="#2d3142" text-anchor="middle">West</text>
  <text x="500" y="428" font-size="20" font-weight="700" fill="#2d3142" text-anchor="middle">East</text>

  <path d="M300 456 V472 M300 464 H500 M500 456 V472" fill="none" stroke="#eb6c36" stroke-width="3"/>
  <text x="400" y="500" font-size="20" font-weight="700" fill="#2d3142" text-anchor="middle">Gap shrinks by 1 hour</text>
</svg>
